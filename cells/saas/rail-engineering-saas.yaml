  stop_conditions:
  - every signal in the set is within its typical pre-deploy variance on the named
    surface — report 'No regression detected on [surface] between [pre-window] and
    [post-window]' explicitly and stop
  - 'a signal moved directionally in the wrong direction and the affected element
    is localized — hand to root_cause or incident_investigation with: surface + time
    window + signal delta + one representative session; stop regression_check'
  - no annotation and engineer cannot provide a date or deploy description — state
    that regression_check requires a time anchor; offer root_cause as the alternative
    path and stop
  description: 'Compare before/after on a named surface around a specific date or
    deploy event. Goal: attribution — did this change cause a signal shift, and on
    which surface?

    '
  triggers:
  - regression
  - after the deploy
  - after we shipped
  - something changed
  - broke after
  - before and after
  - did the release cause
  - deploy
  - rollout
  - release
  - went out last
  investigation_priors:
    surface_order:
    - checkout
    - cart
    - pdp
    - plp
    - search
    - entry
    signal_order:
    - rage-click
    - error-click
    - network-error
    - dead-click
    - page-reload
    regression_flagging: 'Flag signals that moved directionally in the wrong direction.
      The magnitude that warrants flagging is calibrated to the pre-deploy variance
      on this surface for this org — not a fixed percentage. A signal that moved more
      than its typical week-to-week variance (estimated from the pre-deploy window)
      is worth surfacing. State the pre-window, post-window, and the delta; never
      cite a delta alone. [Prior hardcoded 15% threshold removed per N-4: unsourced
      literal, org-specific. Derivation from pre-deploy variance is the correct form.]

      '
    opening_move: 'Check discover_org_context for Fullstory annotations — anchor the
      time window to the annotation timestamp if found. If no annotations, ask for
      the deploy date or a description of the change. Build segments for pre and post
      windows on the named surface. Compute the signal set on both segments. Flag
      any signal that moved directionally in the wrong direction relative to pre-deploy
      variance. Watch a representative post-deploy session.

      '
    branches:
      annotation_branch:
        condition: Customer uses Fullstory annotations — confirm via discover_org_context
        mcp_sequence:
        - discover_org_context — confirm annotation exists for the relevant deploy
        - 'build_segment: named surface, pre-annotation time window'
        - 'build_segment: named surface, post-annotation time window'
        - compute_metric signal set on both segments (rage-click, error-click, network-error,
          dead-click, page-reload)
        - compare pre vs post — flag signals that moved directionally in the wrong
          direction beyond pre-deploy variance (compare_to_previous=true on compute_metric)
        - get_sessions on worst post-annotation segment — 3 to 5 sessions
        - session_open(session_id)
        - session_view()
        - session_close() — MANDATORY
      no_annotation_branch:
        condition: No annotations found or customer does not use Fullstory annotations
        first_question: Can you give me a date or describe the change that went out?
        mcp_sequence:
        - Build time window from engineer's date or description
        - 'build_segment: named surface, pre-deploy time window'
        - 'build_segment: named surface, post-deploy time window'
        - compute_metric signal set on both segments (rage-click, error-click, network-error,
          dead-click, page-reload)
        - compare pre vs post — flag signals that moved directionally in the wrong
          direction beyond pre-deploy variance (compare_to_previous=true on compute_metric)
        - get_sessions on worst post-deploy segment — 3 to 5 sessions
        - session_open(session_id)
        - session_view()
        - session_close() — MANDATORY
        opportunity_note: 'Flag once: "If you start using Fullstory annotations for
          deploys, regression analysis can anchor automatically to deploy timestamps
          — no date lookup required."

          '
  presentation:
    lead_with: Before/after delta on the signal set — not the absolute numbers.
    include:
    - 'signal set with directional delta: pre-window value → post-window value, each
