jobs:
- id: incident_investigation
  trigger: an error is reported, a session URL is shared, or something is actively
    broken
  currency_code: UTL
  currency: time-to-cause — find root cause fast; spending attention and effort to
    locate the exact failure
  currency_breadth: single
  spans: []
  evidence_form: error_chain
  entry_altitude: event
  routes_to:
  - audience: product-mgmt
    form: magnitude with denominator — only when blast radius has product implications;
      pure code fixes route internally within engineering
  stop_conditions:
  - root cause identified and locatable in code — state surface, element, error type,
    and one representative session; stop
  - a single surface accounts for >60% of the error signal — stop broadening; go deep
    on that surface
  - 'cause requires infrastructure or dependency investigation beyond the Fullstory
    event boundary — hand off with: surface + time window + error chain (type → URL
    → console message) + one representative session; stop'
  description: 'Find root cause fast. Engineer has an error signal or a session URL.
    Goal: exact cause and location in code — not scope, not magnitude.

    '
  triggers:
  - session URL
  - error report
  - something's broken
  - users are getting errors
  - seeing errors on
  - something broke
  - we have an incident
  - users can't complete
  - '404'
  - '500'
  - payment failing
  - checkout error
  investigation_priors:
    surface_order:
    - checkout
    - cart
    - pdp
    - plp
    - search
    - entry
    signal_order:
    - network-error
    - console-error
    - error-click
    - dead-click
    - rage-click
    - page-reload
    thresholds:
      session_sample_min: 5
      single_surface_concentration_pct: 60
    opening_move: 'If a session URL is provided: get_session_events first for the
      full error chain, then session_open → session_view → session_close for visual
      context that the event log misses. If no URL: ask for the surface area, build
      a segment on the signal cluster, pull representative sessions, and watch the
      worst. Scale-validate with get_opportunities at the end of either branch; if
      get_opportunities returns empty or org is not on Premium/Advanced, run the fallback
      chain from the industry overlay before reporting no results.

      '
    branches:
      has_session_url:
        mcp_sequence:
        - 'get_session_events(session_id) — full event log: error chain, network failures,
          console errors'
        - session_open(session_id)
        - session_view() — visual and contextual gaps the event log misses
        - session_close() — MANDATORY; pair every open with a close
        - get_opportunities — scale validation; if empty or non-Premium org, run opportunities
          fallback chain from industry overlay before reporting no results
      no_session_url:
        first_question: What page or app surface are we looking at?
        if_surface_named:
          mcp_sequence:
          - build_segment on signal cluster (network-error + error-click + console-error)
            for the named surface — prefer existing segment IDs from org-foundation.md
            (or semantic-index.yaml on an old layer)
          - get_sessions(segment_id, limit=5) — representative sessions across the
            cluster
          - get_session_events on the worst session — full error chain
          - session_open(session_id)
          - session_view() — visual context
          - session_close() — MANDATORY
          - get_opportunities — scale validation; if empty or non-Premium org, run
            opportunities fallback chain from industry overlay
        if_no_surface:
          mcp_sequence:
          - build_segment on broadest error signal set (network-error + error-click)
            org-wide
          - cluster by surface to find signal concentration
          - narrow to the worst surface and proceed as if surface was named
  presentation:
    lead_with: Error type and location — not magnitude, not user count.
    include:
    - 'exact error event chain: type → URL → console message'
    - network-error URL and HTTP status
    - surface and element where error cluster concentrates
    - one representative session clip selected by data — most typical, not most dramatic;
      under 60 seconds
    suppress:
    - magnitude framing — engineer needs cause, not scale
    - narrative prose describing the issue
    - aggregate stats without the specific error chain
    - user-impact summaries
    vocabulary_note: 'Engineers read error chains, not user-impact summaries. Lead
      with the event sequence. Save magnitude for the get_opportunities scale-validation
      note at the end.

      '
  asr: none
- id: performance_audit
  trigger: a specific surface is described as slow, or CWV or loading times are in
    question
  currency_code: UTL
  currency: defensible measurement — p75 labeled against a published band; spending
    time and rigor to produce a number the team can act on
  currency_breadth: single
  spans: []
  evidence_form: defensible_measurement
  entry_altitude: session
  routes_to:
  - audience: product-mgmt
    form: magnitude with denominator — when performance affects a user-facing conversion
      surface broadly
  stop_conditions:
  - one surface accounts for >60% of the compound signal — stop broadening; go deep
    on that surface
  - all CWV Good AND loading-indicator p75 not elevated on the named surface — report
    the negative result explicitly ('No performance issues detected on [surface] against
    Google bands and loading-indicator thresholds at p75') and stop
  - CWV passes but loading-indicator p75 is notably elevated — surface the gap, name
    the affected session count and p75 duration, and stop; this is a finding, not
    a signal to keep querying
  description: 'Surface-specific performance investigation. CWV + behavioral proxies
    + loading indicators. Goal: a defensible measurement the engineer can act on.

    '
  triggers:
  - performance
  - slow
  - page load
  - loading time
  - CWV
  - LCP
  - INP
  - vitals
  - time to interactive
  - hydration
  - spinner
  - skeleton
  - performance of our website
  - performance over Labor Day
  - how did the site hold up
  - site performance during
  - did the site stay up
  - holiday traffic performance
  investigation_priors:
    surface_order:
    - checkout
    - cart
    - pdp
    - plp
    - search
    - entry
    signal_order:
    - rage-click+cursor-thrash
    - page-reload
    - dead-click
    - network-error
    thresholds:
      cwv_bands:
        source: Google Core Web Vitals specification
        LCP:
          good_ms: 2500
          ni_ms: 4000
          measure: p75
        INP:
          good_ms: 200
          ni_ms: 500
          measure: p75
        CLS:
          good: 0.1
          ni: 0.25
          measure: p75
        FCP:
          good_ms: 1800
          ni_ms: 3000
          measure: p75
        TTFB:
          good_ms: 800
          ni_ms: 1800
          measure: p75
      session_sample_min: 5
    opening_move: 'Ask which surface. Check discover_org_context for loading indicator
      elements first — branch on result. Build compound rage-click + cursor-thrash
      segment for the named surface first (more diagnostic than either signal alone
      — indicates page rendered but JS did not hydrate or CLS shifted the layout).
      Then compute CWV at p75 against bands. get_opportunities is not a lead tool
      here; use for scale validation only after signal analysis is complete.

      '
    mcp_sequence:
    - discover_org_context(['loading', 'spinner', 'indicator', 'skeleton', 'loader'])
      — branch on result below
    - 'build_segment: rage-click AND cursor-thrash co-occurrence on the named surface
      — compound signal runs first'
    - 'compute: page-reload rate, dead-click rate, network-error rate on the named
      surface'
    - 'compute: session-duration p75 on checkout surface only (anomalously long =
      stuck, not engaged)'
    - 'compute: LCP p75, INP p75, CLS p75, FCP p75, TTFB p75 — named surface'
    - 'if loading_indicator found: compute p75 visible duration; get_sessions where
      duration is notably elevated relative to the org''s LCP p75 baseline on the
      same surface (not a hardcoded ms threshold)'
    - get_sessions on worst compound-signal segment — 3 to 5 sessions
    - session_open(session_id)
    - session_view() — confirm hydration state, layout shift, spinner persistence
    - session_close() — MANDATORY
    loading_indicator:
      if_found:
        check: 'Compute p75 visible duration. Pull sessions where duration is notably
          elevated relative to the org''s LCP p75 on the same surface — use the org''s
          own distribution as the baseline, not a hardcoded ms value.

          '
        cwv_gap_rule: 'If all CWV = Good but loading_indicator p75 is notably elevated,
          surface this explicitly: "CWV passes — but [X]% of sessions experience [N]s
          load states on [surface]. CWV measures network delivery; it does not capture
          spinner-blocked interaction time."

          '
      if_absent:
        note: 'Consider adding a named Fullstory element for loading states. CWV can
          pass while a spinner blocks interaction for many seconds — this gap is invisible
          without instrumentation.

          '
  presentation:
    lead_with: Surface-specific breakdown — not site average.
    include:
    - p50 / p75 / p95 for each CWV metric — never average alone
    - Google band label (Good / Needs Improvement / Poor) alongside every millisecond
      value
    - compound signal count (rage + thrash sessions) with surface and session context
    - loading indicator p75 visible duration if instrumented
    - representative clips from worst-performing sessions on the named surface
    suppress:
    - site-wide averages
    - single LCP number without percentile label
    - '"LCP is fine" without checking loading indicator duration'
    vocabulary_note: 'Label every metric against its Google band. Never give raw milliseconds
      alone. Lead with the surface name, not the site. The compound rage-click + cursor-thrash
      signal is the highest-priority prior — name it before the CWV table.

      '
  asr: none
- id: regression_check
  trigger: behavior changed after a deploy, and attribution to the release is needed
  currency_code: UTL
  currency: attribution — before/after delta; spending time to establish whether this
    change caused the signal shift
  currency_breadth: single
  spans: []
  evidence_form: defensible_trend
  entry_altitude: cohort
  routes_to:
  - audience: product-mgmt
    form: magnitude with denominator — when regression is visible on a user-facing
      conversion surface
  - audience: engineering
    form: before/after delta on signal set — when regression is a code-level issue
