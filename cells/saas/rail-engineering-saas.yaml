      '
  asr: optional
- id: root_cause
  trigger: users are dropping off or failing without a specific error or session URL
    to start from
  currency_code: UTL
  currency: localization — find where in the funnel and surface the problem concentrates;
    spending effort on diagnosis without a live signal
  currency_breadth: single
  spans: []
  evidence_form: magnitude
  asr: none
  entry_altitude: cohort
  routes_to:
  - audience: product-mgmt
    form: funnel drop-off rate with denominator — product friction findings go to
      PM
  - audience: engineering
    form: signal concentration on worst step — if an error chain emerges, routes internally
  stop_conditions:
  - a single surface accounts for >60% of the drop-off — stop broadening; go deep
    on that surface; hand to incident_investigation if an error chain is present
  - top surface is unbound in the org's surface-map.yaml — fall back to org-wide signal
    order, state this explicitly ('surface-map binding absent for [surface] — using
    org-wide signal order'), and continue on the next-best bound surface
  - funnel and signal evidence both converge on the same step — report the drop-off
    rate with denominator and one representative session that best illustrates the
    exit pattern; stop
  description: 'Users are dropping off or having problems and the engineer has a symptom
    but no session URL or live event. Find where the problem concentrates in the funnel
    and what is happening in those sessions. Distinct from incident_investigation:
    no live event, no URL — start from a symptom.

    '
  triggers:
  - dropping off
  - funnel
  - users abandoning
  - root cause
  - where are users failing
  - why are users leaving
  - find the problem
  - what's causing
  - users aren't converting
  - high exit rate
  - low conversion
  investigation_priors:
    surface_order:
    - checkout
    - cart
    - pdp
    - plp
    - search
    - entry
    signal_order:
    - rage-click
    - error-click
    - network-error
    - dead-click
    - page-reload
    thresholds:
      single_surface_concentration_pct: 60
      session_sample_min: 5
    opening_move: 'Start with get_opportunities — let StoryAI rank the field first.
      If get_opportunities returns empty or org is not on Premium/Advanced, run the
      opportunities fallback chain from the industry overlay in full before reporting
      no results. Then build a funnel on the industry conversion path. Find the step
      with the worst drop-off. Build a segment of sessions that entered that step
      but did not proceed forward. Compute the signal set on that segment. Watch representative
      sessions last.

      '
    mcp_sequence:
    - get_opportunities — let StoryAI rank the field; if empty or org not on Premium/Advanced,
      run opportunities fallback chain from industry overlay before reporting no results
    - build_funnel on industry conversion path — prefer existing funnel IDs from org-foundation.md
      (or semantic-index.yaml on an old layer)
    - compute_funnel — identify the step with the worst drop-off
    - 'build_segment: sessions that entered the worst drop-off step but did not proceed
      forward'
    - compute signal set on that segment (rage-click, error-click, network-error,
      dead-click, page-reload)
    - get_sessions on worst-signal sessions — 3 to 5
    - session_open(session_id)
    - session_view() — confirm what the exit pattern looks like
    - session_close() — MANDATORY
  presentation:
    lead_with: Funnel drop-off rate by step with denominator — not session clips.
    include:
    - funnel drop-off rate by step with denominator (e.g. '34% of cart sessions did
      not reach checkout = ~1,200 users/week')
    - signal concentration on the worst drop-off step
    - one representative session showing the exit pattern — selected by data, not
      by drama
    suppress:
    - bounce rate without funnel context
    - session clips as the first evidence — data must establish the pattern first
    - magnitude claims without denominator
    - speculation about cause without signal evidence
    vocabulary_note: 'Engineers follow data to sessions — not the reverse. Establish
      the funnel pattern and signal concentration first. Name the session that best
      represents the statistical finding, not the most dramatic one.

      '
- id: launch_watch
  trigger: a feature shipped and the team needs to know whether it is landing
  currency_code: UTL
  currency: signal clarity — working / breadth vs. depth / retention; spending time
    and attention to evaluate feature adoption shape
  currency_breadth: multi
  spans:
  - KNW
  evidence_form: defensible_trend
  entry_altitude: population
  measure_resolution: direction_rate
  routes_to:
  - audience: product-mgmt
    form: breadth/depth split with retention trend, feature utilization count, and
      denominator
  stop_conditions:
  - breadth and depth split is clear, retention trend is directional, and feature-specific
    key metrics are computed — report the adoption shape (wide / deep / mixed), state
    the comparison basis (internally constructed per feature, no external benchmark),
    and stop
  - usage is too early to tell — fewer than two comparable periods for trend comparison
    — report 'too early to tell — check back in [N days]' and stop; do not fabricate
    a trend from one data point
  - feature shows no adoption signal at the population level — report explicitly and
    route to product-mgmt with the zero-adoption finding; do not watch sessions to
    find a counter-example
  description: 'Feature shipped. Evaluate whether it is landing. Tim''s framing: a
    combination of retention and the key metrics tied to the feature''s purpose —
    not a single number. The shape matters more than any individual metric. Breadth
    vs. depth: power users vs. broad adoption. Return frequency. Reference point is
    internally constructed per feature; no external benchmarks apply here. Engineers
    and PMs read this together (Tim: "collaborative in practice").

    '
  triggers:
  - we just shipped a feature
  - is this landing?
  - gauge the success of a product launch
  - did the feature work
  - is anyone using it
  - what's the adoption
  - launch metrics
  - post-launch
  investigation_priors:
    reference_point: 'Internally constructed per feature. No cross-org benchmarks
      apply — comparison is against the pre-ship baseline on the same feature surface,
      or against other features in the same product area. Source: Tim''s interview
      2026-09-09.

      '
    signal_order:
    - unique-users-on-feature-surface
    - return-frequency
    - breadth-vs-depth-split
    - session-duration-on-feature-surface
    - feature-specific-key-metrics
    opening_move: 'Ask: what surface or element represents this feature in Fullstory?
      Then build a segment of sessions that touched the feature surface since ship.
      Compute unique users, return frequency, and session duration. Build the breadth/depth
      split: sessions with 1-2 feature interactions (broad) vs. sessions with 5+ (power).
      Compute retention: of the users who touched the feature in week 1, what share
      returned in week 2? Compute feature-specific key metrics as defined for this
      feature. Do not watch sessions first — data establishes the shape, sessions
      illustrate it.

      '
    mcp_sequence:
    - 'build_segment: sessions touching the feature surface since ship date — prefer
      existing segment IDs from org-foundation.md (or semantic-index.yaml on an old
      layer)'
    - 'compute: unique users on feature surface (count_rate with denominator: % of
      active users)'
    - 'compute: return frequency — sessions per user over the observation window (distribution_shape)'
    - 'build_segment: ''breadth'' cohort — users with 1-2 feature interactions since
      ship'
    - 'build_segment: ''depth'' cohort — users with 5+ feature interactions since
      ship'
    - 'compute: feature-specific key metrics (ask engineer or PM what metrics were
      defined for this feature at spec time)'
    - 'compute: retention — unique users from week 1 who returned in week 2 (direction_rate)'
    - get_sessions on 3 to 5 sessions from the depth cohort — understand what power
      users do differently
    - session_open(session_id)
    - session_view() — confirm what feature engagement looks like in practice
    - session_close() — MANDATORY
  presentation:
    lead_with: The adoption shape — wide / deep / mixed — before any individual metric.
    include:
    - unique users with denominator (% of active users who touched the feature)
    - breadth/depth split with user counts for each cohort
    - retention rate (week 1 → week 2 return) with direction
    - feature-specific key metrics (stated when job is kicked off)
    - one representative session from the depth cohort — what power users are doing
    suppress:
    - 'a single metric as the launch verdict — Tim: ''the shape matters more than
      any single number'''
    - cross-org benchmark comparison for a new feature — reference point is internally
      constructed
    - session clips as the first evidence — establish the adoption shape first
    vocabulary_note: 'Engineers and PMs read this together (Tim: "collaborative in
      practice"). Keep language neutral to both: ''adoption,'' ''retention,'' ''breadth
      vs. depth.'' Avoid product-management narrative vocabulary (''delight,'' ''engagement
      score'') and engineering-only vocabulary (''instrumentation coverage,'' ''event
      schema'').

      '
  asr: optional
- id: eng-error-budget-and-recurrence-arc
  trigger: 'Error-budget burn is stressed or a class of user-visible failures has
    recurred across releases, and a single incident ticket can no longer explain the
    shape of the reliability problem.

    '
  currency_code: RSK
  currency: a decision to freeze, fix, or keep shipping, grounded in how user-visible
    risk is accumulating
  currency_breadth: single
  spans: []
  evidence_form: mechanism
  entry_altitude: arc
  asr: required
  routes_to:
  - audience: engineering-leadership
    form: 'reliability brief: burn pattern, recurrence class, user-impact evidence,
      recommended gate'
  - audience: product-mgmt
    form: what user behaviors are absorbing the unreliability, and what velocity trade
      is required
  stop_conditions:
  - the burn is classified as spike vs. creep vs. recurrence-of-same-cause
  - an explicit ship/fix/freeze recommendation is on the table with a review date
  - exception fingerprint named, baseline window stated (default 7 days), comparison
    operator applied (rate ≤ pre-incident baseline)
  - session_close
