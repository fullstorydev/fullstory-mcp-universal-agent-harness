schema_version: 2
audience: marketing
evidence:
  sources:
    - "persona/marketing-lane-20260910.md"
  independence: self_sourced
  source_note: >
    Single source: Lane Greer, ~10 years at Fullstory, ~2,000 customers, hundreds of POCs.
    Self-sourced — not independently corroborated. The interview covered: attribution
    sequence, qualitative currency value, three concrete signals (UTM, path, transaction
    history), and the in-house "path" vocabulary. It did not cover: full currency mix,
    stop conditions per job, evidence rejected, tempo, altitude, or blind spots.
    Those fields are reasoned forward from the interview's findings and the build plan §W-18.

description: >
  Growth and marketing teams using Fullstory to evaluate campaign performance, understand
  post-landing behavior, and measure the arc of user engagement across sessions. Attribution
  is the entry job — which campaign drove this visit, and what did that visitor do? Post-landing
  behavior is the diagnostic follow-on. Campaign value cannot be judged by monetary conversion
  alone: brand engagement, content depth, return visit rate, and newsletter signups are all
  legitimate exchange outcomes. The analyst must maintain two ledgers — did the user accomplish
  their goal? and did the business get a conversion? — and not conflate them.

# ── IN-HOUSE VOCABULARY ───────────────────────────────────────────────────────
# "Path" means something specific here that does not match industry-standard
# attribution vocabulary. State this explicitly before using the word.
path_vocabulary:
  definition: >
    "Path" in this profile means the span of sessions between two conversion events.
    A purchase ends one path and starts the next. "Paths to conversion" = total sessions
    between two transactions.
  disambiguation: >
    This is NOT the industry-standard attribution term. "Attribution path" in external
    marketing vocabulary refers to first-touch / last-touch / multi-touch attribution
    models. Do not conflate them. When a marketer says "path" without qualification, use
    this in-house definition unless they explicitly invoke attribution model language
    (first-touch, linear, time-decay). The RFM and new-vs-repeat framing from the interview
    is the closest external neighbor — not attribution theory.
  source: "persona/marketing-lane-20260910.md — Vocabulary section"

session_opening:
  deployment: [harness]
  template: |
    A few things I can help with:

    - **Campaign attribution** — which campaigns are driving traffic, via what tracking method, and is this a first brand impression or a returning customer?
    - **Campaign performance** — full breakdown: what did campaign visitors do on site, how does this campaign compare to others, and how many converted? (Note: this spans three analyses — I'll name them before measuring anything)
    - **Path depth** — how many sessions does it take between two purchases? (In-house definition: path = session span between transactions, not a first-touch/last-touch model)
    - **Landing behavior** — post-attribution: what are campaign visitors doing once they land? Engaged cohort vs. bounced cohort.

    Campaign success isn't just conversion rate. I'll also look at content depth, return visit rate, and brand engagement — a campaign that drives KNW or ENJ exchanges at scale is a success even without direct transaction lift.

    Where do you want to start?

# ── IGAMING RESTRICTION ───────────────────────────────────────────────────────
# When industry = gaming AND segment = igaming, the following is a HARD BLOCK,
# not a warning. Do not present it as advisory. Do not offer a workaround.
igaming_restriction:
  applies_when:
    industry: gaming
    segment: igaming
  hard_block: >
    Play-management and responsible-gaming-tool signals (self-exclusion page visits,
    deposit-limit changes, responsible-gaming tool interactions, session-frequency
    escalation patterns) are FORBIDDEN as marketing investigation priors, campaign
    targeting inputs, or audience segment criteria. This is a regulatory prohibition,
    not a recommendation: Massachusetts 205 CMR 257.02(3) bars promoting wagers on
    the basis of play-management engagement. A CMO in this sector will know it; any
    analysis that proposes these signals for marketing targeting creates legal exposure.
    Refuse the request and explain the prohibition. Do not suppress it silently.
  scope: >
    This block applies to the marketing persona's investigation_priors and
    signal_order when igaming segment is active. It does not affect compliance
    teams (role.boundary: compliance) using these signals for regulatory monitoring,
    which is governed by persona-support.yaml proactive_prohibition.exceptions.

jobs:

  - id: campaign_attribution
    currency_code: KNW
    currency: "attribution confidence — which campaign drove this visit, and what did those visitors do on site?"
    currency_breadth: single
    spans: []
    description: >
      Identify which campaigns are driving traffic, via what tracking method (UTM params or
      dedicated promo page), and whether the visitor is a first brand impression or an existing
      customer. Arc altitude is mandatory — a display ad impression may not produce a direct click
      but can influence an organic return visit two sessions later. Single-session attribution
      systematically undervalues upper-funnel and display campaigns by assigning their conversions
      to the final organic or direct touch.
    triggers:
      - "which campaign is driving this traffic"
      - "where is this traffic coming from"
      - "UTM breakdown"
      - "campaign source"
      - "attribution"
      - "first touch"
      - "which ad is working"
      - "traffic source"
      - "campaign traffic"
      - "which channel"
      - "source medium campaign"
    evidence_form: magnitude
    entry_altitude: arc
    asr: none
    routes_to:
      - audience: exec
        form: "campaign traffic volume by source with session share and denominator"
      - audience: product-mgmt
        form: "post-landing friction findings: which surfaces trip campaign visitors most often"
    investigation_priors:
      tracking_signal_hierarchy:
        "1": "UTM parameters in session entry URL — utm_source, utm_medium, utm_campaign"
        "2": "Dedicated landing or promo page as session entry point — page slug or URL pattern"
        "3": "Historical transaction presence — greenfield (first brand impression) vs. returning customer already mid-relationship"
        source: "persona/marketing-lane-20260910.md — Three concrete signals"
        note: >
          Check discover_org_context for existing campaign-based segments or UTM-based filters.
          Prefer existing segment IDs from org-foundation.md (or semantic-index.yaml on an old layer) over rebuilding. If no campaign
          segments exist, build from entry URL UTM params first, then named promo page patterns.
      arc_altitude_note: >
        Arc altitude is mandatory for attribution. A user who encounters a display campaign but
        does not click may return organically three sessions later and convert. Single-session
        analysis attributes that conversion to organic, missing the display touch entirely.
        When cross-session data is available, look for a prior campaign touchpoint in the arc
        before assigning the conversion session to direct or organic. Flag the attribution gap
        explicitly when only last-touch signal is available.
      opening_move: >
        Check discover_org_context for UTM-based segments or promo page elements first. If they
        exist, use those IDs — do not rebuild. Then compute bounce rate and funnel depth per
        campaign segment before watching any sessions. Attribution before behavior: establish
        the source split first, then characterize each cohort.
      mcp_sequence:
        - "discover_org_context(['UTM', 'campaign', 'promo', 'landing']) — look for existing campaign segments or promo page elements"
        - "build_segment: sessions where entry URL contains UTM parameters (prefer existing segment from org-foundation.md (or semantic-index.yaml on an old layer))"
        - "build_segment: sessions where entry URL matches named promo or campaign landing page patterns"
        - "compute_metric: session count per campaign source with denominator (all sessions in window)"
        - "compute_metric: bounce rate per campaign segment"
        - "compute_metric: funnel depth per campaign segment — how far into the site did campaign visitors go?"
        - "build_segment: returning users in campaign traffic (historical transaction event > 0 in prior window)"
        - "compute_metric: greenfield vs. returning customer split per campaign source"
        - "get_sessions on the highest-volume campaign segment — 3 to 5 sessions"
        - "session_open(session_id)"
        - "session_view() — confirm entry point, scroll depth, subsequent navigation"
        - "session_close() — MANDATORY; pair every open with a close"
        - "get_opportunities — cross-reference; if empty or non-Premium org, run the industry overlay's opportunities fallback chain before reporting no results"
    stop_conditions:
      - "Campaign sources identified with session share per source and denominator — stop; post-landing behavior is a separate job (landing_behavior)"
      - "Bounce rate and funnel depth computed per campaign segment — attribution analysis complete"
      - "If no UTM parameters and no named landing pages found in session data — state 'no campaign tracking signal detected; cannot attribute traffic by campaign without UTM parameters or named promo pages' and stop"
      - "If arc-level cross-session data is unavailable — state the attribution gap ('only last-touch session data available; upper-funnel display attribution may be undercounted') and proceed with last-touch only"

  - id: campaign_performance
    currency_code: KNW
    currency: "campaign performance report — a multi-part analysis: behavior on site, comparison against other campaigns, and conversion through the funnel"
    currency_breadth: multi
    spans: [UTL, ACQ]
    description: >
      Full campaign performance analysis. This is the canonical multi-breadth job: the
      question "how did this campaign perform?" spans three analyses wearing one sentence —
      end-user behavior through the campaign, comparison against other campaigns, and
      conversion through the campaign funnel. Name all three parts before measuring any
      of them. The marketer may only want one.
    triggers:
      - "how did this campaign perform"
      - "campaign performance"
      - "was this campaign successful"
      - "campaign results"
      - "campaign ROI"
      - "did the campaign work"
      - "how is the campaign doing"
      - "post-campaign analysis"
      - "campaign wrap-up"
      - "performance of our website over [holiday/period]"
      - "how did we do over Labor Day"
      - "Labor Day performance"
      - "holiday campaign performance"
      - "performance over the holiday"
    evidence_form: magnitude
    entry_altitude: arc
    asr: none
    routes_to:
      - audience: exec
        form: "campaign ROI narrative: traffic volume, engagement depth, conversion rate vs. prior campaign benchmark"
      - audience: product-mgmt
        form: "post-landing friction: where did campaign visitors hit drop-off on the conversion path?"
      - audience: engineering
        form: "landing page performance issues: CWV or error signals specific to campaign entry surfaces"
    multi_breadth_protocol:
      rule: >
        Name all three analyses before measuring any of them. State the decomposition back to
        the marketer so they can redirect it — they may only want one. Do not silently pick one
        part and answer as though it were the whole, and do not run all three without stating
        that is what is happening.
      decomposition:
        "1_behavior": "End-user behavior through this campaign — what did these visitors do on site? (engagement depth, bounce, funnel navigation)"
        "2_comparison": "Campaign comparison — how does this campaign rank against others in the same period? (relative source performance)"
        "3_conversion": "Conversion through the campaign funnel — what share of campaign visitors completed the target action?"
      redirect_prompt: >
        "Before I measure anything: 'campaign performance' spans three analyses — (1) what
        campaign visitors did on site, (2) how this campaign compares to others, and (3) how
        many converted. Do you want all three, or is there one that matters most right now?"
      if_all_three: "Proceed in order: behavior → comparison → conversion. Summarize each before starting the next."
    campaign_value_rule: >
      Campaign success is not judged by ACQ (monetary conversion) alone. A campaign that
      drives KNW (information-seeking at scale — deep content reading, comparison behavior) or
      ENJ (entertainment / brand engagement) is a brand success even with zero transactions.
      Newsletter signup, feature discovery, and return visit rate are all legitimate conversion
      outcomes. Evaluate each campaign against its stated objective; do not default to
      transaction rate as the universal judge.
    investigation_priors:
      opening_move: >
        Confirm campaign objective before measuring. A campaign designed for brand awareness
        (KNW/ENJ) and one designed for direct response (ACQ) use different success metrics.
        Ask if unclear. Then decompose the three analyses and run in order.
      mcp_sequence:
        part_1_behavior:
          - "reuse campaign_attribution segment IDs from methodology.yaml — do not rebuild"
          - "compute_metric: session depth (page views per session), scroll depth, dwell time"
          - "compute_metric: bounce rate for the campaign cohort"
          - "compute_metric: post-click surface navigation — which surfaces do campaign visitors reach after landing?"
          - "get_sessions: 3–5 representative engaged sessions from campaign cohort — NOT bounces"
          - "session_open → session_view → session_close — MANDATORY pair"
        part_2_comparison:
          - "discover_org_context — find other active campaigns in the period"
          - "build_segment per other campaign sources in the window"
          - "compute same behavioral metrics across all campaign segments"
          - "rank: session depth, bounce rate, funnel depth per campaign"
        part_3_conversion:
          - "build_funnel: campaign visitor path to conversion (entry → relevant surfaces → target action)"
          - "compute_funnel: conversion rate for campaign visitors with denominator"
          - "compute_metric: campaign conversion rate vs. organic baseline — same period"
          - "get_opportunities — cross-reference conversion blockers StoryAI has independently surfaced; if empty or non-Premium org run fallback chain in full"
    stop_conditions:
      - "All three analyses complete with summaries — stop; do not continue adding dimensions"
      - "If only one part was requested — complete that part only; offer the other two but do not run them unsolicited"
      - "If campaign tracking is absent — state 'campaign performance analysis requires UTM parameters or named promo pages; neither was found' and stop"

  - id: path_depth_analysis
    currency_code: KNW
    currency: "path depth measurement — p50/p75/p95 distribution of sessions between consecutive purchases; not an attribution model"
    currency_breadth: single
    spans: []
    description: >
      Measure the distribution of sessions between two purchases — the in-house "path."
      A purchase ends one path and starts the next; path depth is the count of sessions
      in that span. This is NOT attribution-model "path" (first-touch / last-touch /
      multi-touch). It is the behavioral rhythm of the customer: how many visits before
      they buy again. Requires historical transaction events in the semantic layer.
    triggers:
      - "paths to conversion"
      - "how many sessions to convert"
      - "how many touches"
      - "session span between purchases"
      - "path depth"
      - "sessions between orders"
      - "return visit pattern"
      - "how long before they buy again"
      - "repurchase cadence"
    evidence_form: defensible_measurement
    entry_altitude: arc
    asr: none
    routes_to:
      - audience: product-mgmt
        form: "re-engagement opportunity: p75 path depth indicates how much runway exists before a second purchase for typical customers"
      - audience: exec
        form: "customer lifecycle narrative: typical path depth and how it varies by acquisition source or cohort"
    path_vocabulary_gate: >
      Before measuring, confirm the person means path-as-session-span, not
      path-as-attribution-model. Ask once if ambiguous: "By 'path,' do you mean the number
      of sessions between two purchases, or are you asking about which marketing channel
      influenced the purchase?" Do not assume.
    investigation_priors:
      precondition: >
        Path depth analysis requires historical transaction events in the semantic layer.
        Check org-foundation.md (or semantic-index.yaml on an old layer) for a transaction or purchase event before building segments.
        If no transaction event exists, state: "Path depth analysis requires a purchase or
        conversion event in the semantic layer — none found. Session frequency for returning
        users can still be analyzed, but sessions-between-transactions cannot be computed
        without a transaction event." Stop and wait for direction.
      opening_move: >
        Verify transaction event in org-foundation.md (or semantic-index.yaml on an old layer) first. Gate on absence — do not
        substitute. Then build the repeat-purchaser segment (2+ transactions in the window)
        and compute the p50/p75/p95 distribution of sessions between consecutive transactions.
      mcp_sequence:
        - "verify transaction event exists in org-foundation.md (or semantic-index.yaml on an old layer) — gate: stop if absent, state precondition gap"
        - "build_segment: users with 2+ transactions in the analysis window"
        - "compute_metric: distribution of session count between consecutive transactions — p50, p75, p95"
        - "compute_metric: path depth by acquisition source (UTM or landing page) — do paid-traffic converters take shorter or longer paths?"
        - "compute_metric: calendar days between transactions at p50/p75/p95 — time span alongside session count"
        - "compute_metric: path depth by new vs. repeat buyer cohort if available in semantic layer"
        - "get_sessions: 3 representative arcs — one short-path converter (p25 or below), one median-path converter, one long-path converter (p75 or above)"
        - "session_open → session_view → session_close — MANDATORY pair"
    stop_conditions:
      - "p50/p75/p95 of session count and calendar days between transactions computed with denominator (users in analysis window) — that is the finding; stop"
      - "If transaction event is absent from semantic layer — stop after stating the gap; do not substitute returning-user segment for path depth"
      - "If fewer than 100 users have 2+ transactions in the window — state 'insufficient repeat-purchase sample (N < 100); treat as directional only' and stop"

  - id: landing_behavior
    currency_code: KNW
    currency: "post-landing engagement — count and rate of meaningful engagement by campaign visitors vs. organic baseline"
    currency_breadth: single
    spans: []
    description: >
      After attribution is established, diagnose what campaign visitors do once they land.
      Builds on campaign_attribution segmentation — reuse those segment IDs from
      methodology.yaml. The diagnostic question: do campaign visitors engage with the site
      or land and leave? A non-buying session is not automatically a failed campaign session —
      brand exposure and content consumption are complete exchanges.
    triggers:
      - "what are these visitors doing"
      - "post-click behavior"
      - "landing page engagement"
      - "what happens after they click"
      - "campaign visitor behavior"
      - "are these visitors engaged"
      - "why are they bouncing"
      - "landing page quality"
    evidence_form: magnitude
    asr: none
    entry_altitude: cohort
    routes_to:
      - audience: product-mgmt
        form: "friction on campaign landing surfaces: where do engaged visitors hit drop-off, with magnitude and denominator"
      - audience: engineering
        form: "landing page performance: CWV or error signals on campaign entry surfaces that suppress engagement"
    non_buying_session_rule: >
      Apply non_buying_session_rule from currency-grammar.yaml. A session that does not
      convert is not a failed campaign session unless ACQ intent was established (cart visit,
      checkout attempt, or product search with purchase signals). A user who lands from a brand
      campaign and reads three articles has completed a KNW or ENJ exchange. Maintain two
      ledgers: did the user engage? and did the business get a conversion? Test for ACQ intent
      before attributing any signal to ACQ failure.
    investigation_priors:
      engaged_vs_bounced_split:
        engaged_definition: "session_depth > 1 page AND at least one interaction beyond page view (click, scroll past 50%, form field, search)"
        bounced_definition: "entry page only, no meaningful interaction, exits with no second-page view"
        rule: >
          Always split into engaged vs. bounced before diagnosing. A landing page engagement
          problem is fixed by improving the page. A traffic quality problem is fixed by
          improving campaign targeting. They are different root causes requiring different owners.
        source: "Build plan W-18; persona/marketing-lane-20260910.md bounce-rate finding"
      opening_move: >
        Retrieve campaign_attribution segment IDs from methodology.yaml. Do not rebuild them.
        Build an organic/direct baseline segment for the same time window — the diagnostic
        question is whether campaign visitors behave differently from baseline, not whether
        they are perfect in isolation.
      mcp_sequence:
        - "retrieve campaign_attribution segment IDs from methodology.yaml — do not rebuild"
        - "build_segment: organic/direct sessions for same time window (baseline comparison)"
        - "compute_metric: bounce rate — campaign cohort vs. organic baseline"
        - "compute_metric: session depth (page views per session) — campaign cohort vs. organic baseline"
        - "compute_metric: scroll depth on landing surface — campaign cohort vs. organic baseline"
        - "build_segment: engaged campaign visitors (session_depth > 1, at least one non-pageview interaction)"
        - "compute_metric: which surfaces do engaged campaign visitors navigate to after landing?"
        - "compute_metric: frustration signals on the landing surface — rage-click, error-click, dead-click for engaged cohort"
        - "get_sessions: 3–5 sessions from the ENGAGED cohort (bounces contain no useful behavioral signal)"
        - "session_open → session_view → session_close — MANDATORY pair"
        - "get_opportunities — cross-reference any engagement blockers with StoryAI findings; if empty or non-Premium org run fallback chain"
    stop_conditions:
      - "Bounce rate and engagement split computed vs. organic baseline, with denominator — that is the landing behavior finding; stop"
      - "If campaign bounce rate > 70% — before diagnosing the landing page, offer to return to campaign_attribution to diagnose traffic quality: high bounce may be targeting, not page design"
      - "If engagement metrics match organic baseline — state 'campaign visitor behavior is not meaningfully different from organic baseline on this surface' and stop; that is a finding"

  - id: creative_diagnosis
    currency_code: KNW
    currency: "creative diagnosis — why the creative or message underperformed, not that the metric dropped"
    currency_breadth: single
    spans: []
    description: >
      When a campaign or landing page underperforms, this job distinguishes creative and message
      failure from distribution, targeting, or timing failure. Fullstory's behavioral evidence
      is strongest on the landing and engagement side — what did visitors who arrived actually
      do? Did they engage with the content, ignore it, or leave immediately? It is weaker on
      pre-click targeting quality — that is attribution-layer analysis. This job does not
      duplicate launch-watch; launch-watch is a time-bounded post-launch assessment. Creative
      diagnosis is triggered by sustained underperformance signals. Marketing creative diagnosis
      can overlap with exec launch-watch; do not duplicate an exec-facing launch-watch job here.
    triggers:
      - "why is this campaign not converting"
      - "what's wrong with our creative"
      - "the ad is getting clicks but nothing is happening"
      - "why is the landing page not working"
      - "our message isn't resonating"
      - "which variant is underperforming"
      - "creative isn't converting"
      - "campaign is underperforming"
      - "the creative is failing"
      - "landing page isn't working"
    evidence_form: mechanism
    entry_altitude: session
    asr: optional
    playbook_gate: >
      Before firing any MCP sequence, confirm which read the human wants: Are they diagnosing
      a specific variant? Comparing variants? Or looking at overall landing behavior for the
      campaign cohort? One-sentence answer gates the sequence. Do not fire a multi-metric
      sequence before this is confirmed.
    routes_to:
      - audience: exec
        form: >
          Creative performance summary: bounce rate vs. organic baseline, engagement depth, and
          conversion gap — with denominator. Note: FS seat is partial for roadmap prioritization
          — behavioral evidence informs product direction but does not replace product strategy
          judgment.
      - audience: product-mgmt
        form: "landing friction: which elements are blocking engagement for campaign visitors vs. organic baseline"
    investigation_priors:
      opening_move: >
        Check discover_org_context for existing campaign segments or variant-tagged landing pages.
        Prefer existing segment IDs from org-foundation.md (or semantic-index.yaml on an old layer). Build a campaign cohort (sessions
        from the underperforming campaign) vs. an organic baseline cohort on the same surface.
        Compute bounce rate and engagement depth first — determine whether visitors are landing
        and leaving immediately (creative or targeting problem) or landing and engaging without
        converting (landing or friction problem).
      mcp_sequence:
        - "discover_org_context(['campaign', 'creative', 'variant', 'landing']) — find existing campaign segments or tagged variant pages in org context"
        - "build_segment: sessions from underperforming campaign (UTM or named landing page)"
        - "build_segment: organic baseline sessions on the same surface (same date window)"
        - "compute_metric: bounce rate per cohort (campaign vs. organic) with denominator"
        - "compute_metric: engagement depth per cohort — scroll, click, or content interaction"
        - "compute_metric: conversion rate per cohort (if conversion event in semantic layer)"
        - "get_sessions: 3–5 sessions from the campaign cohort — prefer engaged non-converters over bounces"
        - "session_open(session_id)"
        - "session_view() — observe landing, content interaction, navigation path, exit"
        - "session_close() — MANDATORY pair"
        - "get_opportunities — cross-reference conversion blockers with StoryAI findings"
    stop_conditions:
      - "kill variant — bounce rate significantly above organic baseline AND engagement depth below baseline: creative is not landing; present evidence; recommend killing or replacing the variant"
      - "iterate hook — engagement comparable to organic but conversion below baseline: visitors land but conversion path is failing; recommend iterating CTA or offer framing"
      - "reallocate budget — campaign delivers clicks but visitor cohort is structurally different from the converting population (wrong audience signal): distribution problem is upstream; recommend reallocating spend rather than redesigning creative"
      - "If creative and organic engagement are statistically indistinguishable — state that FS behavioral evidence does not support a creative diagnosis; underperformance may be attribution, timing, or external — stop"

# ── PROFILE-LEVEL FIELDS ──────────────────────────────────────────────────────

accepts:
  - "campaign-level aggregates with denominator"
  - "bounce rate by campaign source"
  - "funnel depth by campaign cohort"
  - "cross-campaign comparison on shared behavioral metrics"
  - "non-monetary value signals: content consumption depth, return visit rate, newsletter signup"
  - "arc-level cross-session patterns — multi-visit behavioral trajectories"
  - "greenfield vs. returning customer split"
  - "path depth distribution (p50/p75/p95) when transaction events exist in semantic layer"
  - "campaign comparison anchored to campaign objective (ACQ vs. KNW vs. ENJ campaigns judged differently)"

rejects:
  - "session-level detail without aggregate backing data"
  - "session clips as primary attribution evidence"
  - "technical root cause (engineering domain — route via routes_to)"
  - "single-session attribution for display or upper-funnel campaigns (arc altitude required)"
  - "monetary conversion rate as the sole judge of campaign success without confirming campaign objective"
  - "magnitude claims without denominator"

volunteers:
  - "after any campaign attribution finding: offer path_depth_analysis to understand how many sessions converting visitors needed (if transaction events exist)"
  - "after any landing behavior finding: offer compare-successes analysis (engaged vs. bounced cohort comparison) per universal_exceptions.compare_successes"
  - "after any campaign performance analysis: check whether StoryAI opportunities surface conversion blockers that are suppressing campaign ROI independently of campaign quality"

declines:
  - "user-level cross-device attribution requiring PII matching — Fullstory sessions are user-keyed but cross-device identity resolution is a CDP-layer capability, not a Fullstory behavioral analysis"
  - "campaign ROI in dollar terms — Fullstory has behavior and conversion data, not media spend; can report conversion rate and engagement depth but not cost-per-acquisition"

tempo: slow
room: >
  Post-campaign analysis meetings, QBR prep, digital marketing team syncs, and campaign
  planning sessions. Attribution debates are common — marketers often arrive with a
  hypothesis about which campaign is performing and want validation or contradiction.
  The room is comfortable with aggregate data but will push for "why" answers that
  require session review. Campaign comparisons can be politically sensitive — be precise
  about what the data shows vs. what it implies about team decisions. Non-monetary value
  framing (brand engagement, content depth) is often necessary to reframe a "0% conversion"
  result as a success when that was the objective.

maturity_signals:
  - "UTM parameters consistently present in session entry URLs — signals intentional campaign tracking"
  - "Dedicated landing or promo pages instrumented with Fullstory — enables named-page entry attribution"
  - "Transaction or purchase events instrumented in the semantic layer — required for path depth analysis"
  - "Fullstory annotations in use for campaign launch dates — enables clean before/after campaign comparisons"

industry_variance:
  - industry: retail
    note: >
      BFCM and seasonal campaign peaks are the dominant attribution confound. Attribution
      is relatively clean — purchase = conversion event, direct ACQ signal. Path depth is
      short for commoditized categories (1–2 sessions) and long for high-consideration items
      (5+ sessions). A November campaign outperforming October is not a fair comparison without
      controlling for BFCM traffic — apply seasonality_rule from currency-grammar.yaml.
  - industry: fintech
    note: >
      Privacy controls and compliance requirements may limit UTM tracking in certain regions
      or for regulated user populations. Conversion event may be account opening, loan
      application, or approval — not a purchase. The arc is longer and path depth distribution
      is wider. Campaign traffic quality is harder to assess because intent signals differ
      (research vs. commitment-ready). Regulatory context: do not surface PII-adjacent
      tracking details in deliverables.
  - industry: saas
    note: >
      Campaigns often target trial signups, not direct revenue. Attribution arc is long — a
      campaign impression in January may drive a trial signup in March, which converts to
      paid in May. Path depth between trial signup and paid conversion can span dozens of
      sessions. Campaign success metrics are CAC-adjacent: activation rate within the trial
      window is more actionable than direct conversion rate from campaign click to paid plan.
  - industry: travel
    note: >
      Seasonal demand peaks create strong attribution confounds (summer booking window, holiday
      travel, spring break). A campaign may drive awareness without direct booking attribution —
      a user sees a destination campaign, researches across three sessions, then books organically
      on a fourth visit. Loyalty program status significantly affects path depth: members book
      in fewer sessions. Apply seasonality_rule before any trend claim.
  - industry: gaming
    note: >
      "Campaign" may refer to an in-game promotional event rather than an acquisition campaign —
      clarify which before measuring. Platform-specific acquisition channels (app store, web,
      social ads) create structurally different attribution patterns. In-game campaign attribution
      requires event instrumentation that many gaming orgs have not built into their Fullstory
      setup; verify in org-foundation.md (or semantic-index.yaml on an old layer) before attempting path analysis.

not_applicable_industries: []
  # Marketing exists across all five industries. No exclusions.

presentation:
  lead_with: "Campaign-level aggregate with denominator — not individual session observation."
  include:
    - "denominator with every percentage ('18% of campaign visitors = ~2,100 users this week')"
    - "campaign comparison: show relative ranking alongside the absolute number"
    - "non-monetary value: name the currency the campaign produced (KNW, ENJ) before concluding it underperformed on ACQ"
    - "arc context: if session-level data is shown, state which visit in the arc it represents"
    - "baseline: always compare campaign cohort against an organic or direct baseline; a number without a comparison is not a finding"
  suppress:
    - "session clips as attribution evidence"
    - "single-campaign findings without a comparison baseline"
    - "conversion rate alone without engagement context (0% conversion + 80% bounce is a different problem from 0% conversion + deep content engagement)"
    - "dollar ROI claims — Fullstory has behavior and conversion, not media spend"
    - "technical error chains (engineering domain)"
  vocabulary_note: >
    "Path" always means session span between transactions unless the marketer explicitly
    references attribution models (first-touch, last-touch, multi-touch). Never conflate.
    "Conversion" must be qualified — conversion to what? (purchase, trial signup, account
    open, newsletter signup). Do not assume monetary conversion unless confirmed.
    "Campaign performance" is a multi-breadth ask — decompose before measuring.

# ── SPECIALIZATION OVERLAYS ───────────────────────────────────────────────────
# These overlays apply when a marketing analyst self-identifies a specialization
# at session start (analysis-start-gate.md step (f)) or during onboarding.
# They are NOT new audience values. MANIFEST.yaml is unchanged.
# Load the matching block when marketing_specialization is set in methodology.yaml.

specialization_overlays:

  merchandiser:
    label: "Brand Merchandiser"
    description: >
      Brand P&L owners who manage page-level presentation for their brand on a retailer site
      or brand hub. Their job is to ensure layout, content order, and formatting are winning
      the shopper — not to run campaigns. They do not own retail media by default.
    scope:
      in: "brand hub page, brand category page (when brand owns it), product detail page layout"
      onboarding_ask: "Is your focus on the brand hub only, or do you also own category and search landing pages for your brand?"
      not_in: "campaigns (unless the brand is in them), shelf-reset or planogram (physical), retail media ad spend"
    jobs:
      - id: merchandiser_page_diagnosis
        currency_code: KNW
        currency: "page diagnosis — whether layout, content order, or formatting is losing the shopper before they reach the buy decision"
        currency_breadth: single
        description: >
          When a brand page underperforms, determine whether the issue is layout (wrong components
          above the fold), content order (reviews, imagery, buy box sequencing), or formatting
          (visual hierarchy failing to guide the shopper). Decision: reorder, reformat, or change
          placement. Heatmaps are out of MCP scope. The path is CSS probe → segment → ASR.
        playbook_gate: >
          Confirm which page scope the human is diagnosing (brand hub, product detail, category)
          before firing any MCP sequence. Confirm whether named elements exist in the semantic
          layer first; if not, use the CSS selector probe rail.
        css_probe_rail: ".claude/rails/css-selector-probe-rail.md"
        evidence_form: mechanism
        entry_altitude: session
        asr: required
        asr_note: >
          ASR cap is ~50 sessions per get_sessions call. Sample; do not exhaust. State explicitly:
          "This analysis sampled N sessions — findings are directional, not exhaustive."
        mcp_sequence:
          - "discover_org_context(['brand', 'review', 'gallery', 'buy-box', 'product-image', 'merchandising']) — find named elements before probing"
          - "If named elements found: build_segment using existing element IDs from org-foundation.md (or semantic-index.yaml on an old layer)"
          - "If no named elements: use CSS selector probe rail (.claude/rails/css-selector-probe-rail.md) — broad prefix probe on click events ([class^='review'], #buy-box, [data-testid^='gallery'])"
          - "compute_metric: click volume per probed component family — rank to find which components receive traffic"
          - "build_segment: sessions where shoppers clicked the winning component family"
          - "get_sessions: sample 10–20 sessions from that segment (within ASR cap)"
          - "session_open(session_id)"
          - "session_view() at the relevant component timestamp — observe layout interaction, scroll to component, engagement"
          - "session_close() — MANDATORY pair"
          - "get_opportunities — cross-reference with StoryAI findings on the page"
        stop_conditions:
          - "reorder — component receives minimal clicks despite being above the fold: placement is wrong; stop and present evidence"
          - "reformat — component receives clicks but exits immediately follow: formatting or content is failing after the click; stop and present evidence"
          - "change placement — component is below the fold and receives near-zero engagement: it exists but is not being seen; stop and recommend surfacing it"
          - "If no CSS selector probe returns click volume above zero across all candidate families — state 'no named or discoverable component signal found; consult engineering team to instrument the page' and stop"

  retail_media_peer:
    label: "Retail Media Owner"
    description: >
      Peer to the brand merchandiser under the marketing trunk. Retail media owners manage
      paid ad placements on the retailer's site — sponsored listings, banner placements, promoted
      positions — and need to prove those placements moved brand sales. This is NOT a
      merchandiser function; they manage ad ROI, not page layout. Session evidence is the
      path: track sessions that clicked a paid placement, then observe post-click behavior and
      conversion outcome.
    scope:
      in: "sponsored listings, promoted placements, banner ads on the retailer site"
      not_in: "organic brand page layout (that is merchandiser), external media buys (that is campaign)"
    jobs:
      - id: retail_media_roi
        currency_code: KNW
        currency: "retail media ROI — whether paid placements on the retailer site moved brand sales relative to cost"
        currency_breadth: multi
        description: >
          Prove that paid slots on the retailer's site generated brand sales. Decision: cut
          the placement (not working), shift to a different position or format (wrong placement),
          or justify the spend (ROI positive). Heatmaps are out of MCP scope. Session evidence
          after click is the path — build a segment of sessions that clicked a paid placement,
          observe post-click behavior, and measure conversion to purchase.
        playbook_gate: >
          Confirm which placement(s) are under analysis before building any segment.
          Confirm whether click events on the placement are instrumented in the semantic layer.
          If not instrumented, CSS probe rail is the fallback for click discovery.
        css_probe_rail: ".claude/rails/css-selector-probe-rail.md"
        evidence_form: magnitude
        entry_altitude: session
        asr: optional
        mcp_sequence:
          - "discover_org_context(['sponsored', 'promoted', 'ad', 'placement', 'retail-media']) — find existing placement segments or click events"
          - "build_segment: sessions that clicked a paid placement (use semantic layer event if instrumented; otherwise CSS probe rail on placement selector)"
          - "build_segment: organic search sessions on same brand/category (control group)"
          - "compute_metric: conversion rate (paid placement cohort vs. organic) with denominator"
          - "compute_metric: revenue per session for paid placement cohort (if transaction event exists)"
          - "get_sessions: 3–5 sessions from paid placement cohort — observe post-click path"
          - "session_open(session_id)"
          - "session_view() — observe path from placement click through product page to cart/purchase"
          - "session_close() — MANDATORY pair"
          - "get_opportunities — cross-reference with StoryAI conversion opportunities"
        stop_conditions:
          - "cut placement — conversion rate for paid cohort is at or below organic baseline: the placement is not adding lift; stop and present evidence"
          - "shift placement — conversion rate is above baseline but significantly below expectation: wrong position or format; recommend testing an alternate placement"
          - "justify spend — conversion rate and/or revenue per session is measurably above organic baseline: placement is delivering; stop and present the ROI evidence"
          - "If no click events on placements are found in the semantic layer and CSS probe returns zero — state 'placement click instrumentation not detected; cannot measure post-click behavior without event tagging' and stop"
