schema_version: 2
audience: support
description: 'Customer support agents and support engineers investigating inbound
  cases. Purely reactive — ten years of failed attempts to make it otherwise. Do not
  build, offer, or suggest proactive scanning. The job starts when a ticket arrives,
  not before. Evidence bar is set by engineering''s rejection criteria ("nothing in
  Splunk"), not support''s own standard. The winning artifact is a reproducible segment
  definition, not a session link.

  '
evidence:
  sources:
  - persona/support-lane-20260908.md
  - persona/support-kelsey-20260915.md
  independence: multi_sourced
  note: 'Lane Greer (self-sourced): ~10 years, ~2,000 customers. Field-pattern confidence
    is high — repeated firsthand attempts to shift support''s usage model (all failed).

    Kelsey (Strategic Solutions, 2026-09-15): 3 years on Fullstory''s own support
    team, multi-year sales exposure to customer support/CX teams. Verified in depth
    for SaaS only; broader industries claimed but not detailed on request.

    '
linkage_precondition:
  rule: 'Before any session-based job begins, a link between the support case and
    a Fullstory session must be established. This is not a soft dependency. If linkage
    fails, the job stops here and outputs the failure statement below.

    '
  output_on_failure: '"Linkage not established. I cannot proceed without connecting
    this case to a Fullstory session. Three methods are available, in preference order
    — which do you have access to?"

    '
  methods:
  - id: getCurrentSessionURL_api
    description: 'getCurrentSessionURL called at case submission; session URL rides
      in the case payload. Fully deterministic.

      '
    determinism: deterministic
    confidence_ceiling: high
  - id: support_id_index
    description: 'A random support ID printed at the page footer and indexed into
      Fullstory as a user attribute, with a watch element. Agent asks the caller to
      read it back, then searches for the value. Near-deterministic. A workaround
      — but used with high effectiveness.

      '
    determinism: near_deterministic
    confidence_ceiling: high
  - id: identifying_info
    description: 'Identifying info in the user profile, or narrowing by city, device,
      browser, and timestamp. Probabilistic — you may be watching the wrong person.

      '
    determinism: probabilistic
    confidence_ceiling: low
    downstream_warning: 'State the linkage method and its confidence ceiling explicitly.
      When linkage is probabilistic, every downstream conclusion must carry the qualifier:
      "if this is the correct session." Never compound probabilistic linkage with
      a confident conclusion.

      '
  hard_rule: 'Email address is not a recommended method. Do not suggest it — it pushes
    toward PII that customers should not share through Fullstory. If a customer has
    done it anyway, do not endorse it as a workflow.

    '
  product_gap: 'No first-class case-to-session join exists in Fullstory. Two of the
    three linkage methods are improvisations; one pushes toward PII. Record as a gap
    when relevant.

    '
proactive_prohibition:
  rule: 'Do NOT build, offer, or suggest a proactive scan, discovery workflow, or
    pre-ticket signal review for the support audience. This prohibition is absolute
    and requires no per-session justification.

    '
  evidence: 'Ten consecutive years of failed attempts to shift support teams into
    proactive Fullstory use. The audience is structurally reactive — they respond
    to cases; they do not initiate analysis. Proactive discovery is a product management
    job.

    '
  failure_mode: '"While I''m here, I noticed a few other issues you might want to
    look at." This misreads the job. Support agents are in triage mode, not exploration
    mode. Unsolicited findings outside the reported case add noise and can undermine
    the agent''s credibility on the actual case.

    '
  differentiator: 'This is one of the hardest audience differentiators in the kit.
    Product management has a legitimate proactive-discovery entry point. Support does
    not.

    '
  exceptions:
    - role_boundary: compliance
      applies_when:
        industry: gaming
        segment: igaming
      rationale: >
        Responsible-gaming monitoring is a proactive scan by definition — a compliance
        officer initiating analysis to satisfy a regulatory obligation is not waiting
        for a ticket. Default support prohibition would load the wrong investigation
        priors for this role. Exception scoped to gaming/igaming compliance boundary only.
        Debt: a dedicated Compliance persona is the correct long-term solution
        (deferred until gaming×igaming cells are authored).
jobs:
- id: self_service_gap_review
  source: "prior-corpus, not kelsey-20260915"
  trigger: 'A pattern of inbound tickets suggests users attempted self-service before
    reaching support — they searched help content, scanned FAQ pages, or navigated
    to documentation and still submitted a case. The support agent needs to understand
    whether the knowledge base is failing a cohort of users at a specific step, not
    just a single caller.

    '
  currency_code: KNW
  currency: time and effort spent seeking the right information to resolve a question
    independently (KNW)
  currency_breadth: cohort
  spans: []
  evidence_form: pattern
  measure_resolution: count_rate
  entry_altitude: cohort
  presentation:
    lead_with: 'The cohort definition and its size. Engineering and content teams
      need a reproducible group definition, not a single session reference.

      '
    include:
    - 'cohort definition: the signal pattern that identifies users who searched-and-failed'
    - 'count + rate: how many users hit this pattern in the relevant window'
    - knowledge surface where the gap concentrates
    suppress:
    - proactive recommendations outside the ticket-driven scope
    - individual session narratives
  asr: none

- id: initial_triage
  source: kelsey-20260915
  trigger: "what the heck is the customer talking about?"
  currency_code: UTL
  currency: time and effort spent understanding what actually happened before routing
  currency_breadth: single
  spans: []
  evidence_form: artifact
  entry_altitude: session
  form: description-first; located replay only if the description does not resolve it
  asr: optional
  presentation:
    lead_with: A text description of what the customer ran into.
    include:
    - description of what actually happened
    - session replay link only if the text description does not resolve the question
    suppress:
    - raw replay dump as the first artifact — do not lead with a session link
    - long-form session narratives
    - meeting-shaped readout
  stop_conditions:
  - routed to expectation_mismatch_cya
  - routed to bug_scope_check
  - '"refresh and retry" if clearly a one-off with no pattern'
  rejects:
  - a long session recording with no located moment to watch

- id: expectation_mismatch_cya
  source: kelsey-20260915
  trigger: "is the customer telling the truth or did they mis-remember?"
  currency_code: UTL
  currency: evidentiary artifact that determines whether the UI was genuinely unclear
    or the customer is mistaken
  currency_breadth: single
  spans: []
  evidence_form: artifact
  entry_altitude: session
  form: screenshot + exact copy (evidentiary artifact, not a metric)
  asr: required
  presentation:
    lead_with: The screenshot and exact copy the customer was shown at that moment.
    include:
    - screenshot of the UI at the relevant moment (ASR)
    - exact copy shown to the customer at that moment
    suppress:
    - metrics or benchmarks — this is a direct evidentiary check, not a comparison
    - climbing to population on branch A (customer at fault)
    - anything short of the screenshot — copy alone is not enough
  stop_conditions:
  - "branch A — customer at fault: screenshot is enough to push back if they complain"
  - "branch B — UI genuinely confusing: not done until count of people who saw that\
    \ UI plus ticketing-system corroboration sufficient to argue for a product change"
  - session_close
  rejects:
  - anything short of the screenshot — copy alone is not sufficient

- id: bug_scope_check
  source: kelsey-20260915
  triggers:
  - "who else is impacted by this bug?"
  - "what is the scope of people impacted?"
  - "which of our largest customers impacted?"
  currency_code: UTL
  currency: scope definition and account impact sufficient for an engineering ticket
  currency_breadth: population
  spans: []
  evidence_form: pattern
  entry_altitude: cohort
  form: eng-ticket-ready writeup — affected conditions/segments, percentage of total
    customers with denominator, named high-paying/VIP accounts
  asr: optional
  required_output_fields:
  - segment definition (affected conditions/segments — e.g. old IE version, beta flag)
  - count + rate with denominator
  - named high-value accounts (from support.vip_definition when present; if property
    is missing, state so and still give percentage — do not invent account names)
  reference_point: 'No fixed baseline — judged on absolute magnitude (0.2% vs. 20%)
    AND whether it skews to high-value accounts. [seen/principle/support-saas]

    '
  presentation:
    lead_with: Scope — which accounts are impacted, what percentage, and whether
      high-value accounts are among them.
    include:
    - segment definition with affected conditions (re-runnable by engineering)
    - count + rate with denominator
    - named high-value accounts from support.vip_definition
    - note when vip_definition is absent — give percentage, do not invent account names
    - technical detail (selector, failed request) visible — both support leaders and
      ICs review the eng ticket before it goes out
    suppress:
    - error message alone without scope — directional but not trustworthy
    - magnitude-only without segment definition
  stop_conditions:
  - enough to send a customer response and file a ticket that engineering will not
    bounce back asking for more
  rejects:
  - a specific error message with no scope attached — interesting and directional
    but not enough on its own

- id: pre_training_call_prep
  source: kelsey-20260915
  trigger: "how familiar with our product is this team I'm about to meet?"
  currency_code: KNW
  currency: per-invitee usage profile skimmable before a training call
  currency_breadth: cohort
  spans: []
  evidence_form: pattern
  entry_altitude: cohort
  form: skimmable in ~30 seconds, directional only — supplements live questions on
    the call, does not replace asking them
  asr: none
  needs:
  - time in product (per invitee, attending or not)
  - help articles read recently (if visible in Fullstory)
  - first-session recency (tenure signal)
  - top features used
  - 'job titles: out of band (LinkedIn). Do not pretend MCP has job titles.'
  stop_conditions:
  - a quick skim is sufficient; no deeper digging needed before the call
  rejects: []

- id: support-repeat-contact-and-known-issue-arc
  source: "prior-corpus, not kelsey-20260915"
  trigger: 'The same issue is generating contacts across days or customers, or one
    customer is returning after a supposedly closed ticket, and FCR metrics no longer
    describe the problem.

    '
  currency_code: TRS
  currency: evidence that the failure is a pattern, so recovery can be systemic rather
    than one-ticket
  currency_breadth: single
  spans: []
  evidence_form: magnitude
  entry_altitude: arc
  asr: none
  routes_to:
  - audience: product-mgmt
    form: known-issue brief with volume, recurrence window, and session evidence
  - audience: customer-experience
    form: which customers are in a broken recovery journey
  stop_conditions:
  - the issue is scoped as isolated vs. recurring vs. systemic
  - a recovery owner exists outside the original ticket

- id: support-trust-recovery-followthrough
  source: "prior-corpus, not kelsey-20260915"
  trigger: 'A severe or public failure has been ''fixed'' in the product but the affected
    customers'' subsequent sessions still show hesitation, workaround, or abandonment.

    '
  currency_code: TRS
  currency: whether trust actually returned after the fix, not whether the ticket
    closed
  currency_breadth: single
  spans: []
  evidence_form: mechanism
  entry_altitude: arc
  asr: required
  routes_to:
  - audience: customer-experience
    form: post-recovery behavior of the affected cohort vs. a matched cohort
  stop_conditions:
  - frustration signals (rage click, error click, reload) on the affected surface
    return to ≤ pre-incident 28-day baseline AND hold for 7 days post-fix
  - the original incident event type is absent from the affected cohort's return sessions
  - a further recovery action is either justified or explicitly closed
  - session_close

accepts:
- session observation with timestamps — shareable, staked-on evidence
- segment definitions that can be re-run by engineering
- error event chains (type → URL → console message)
- exemplar sessions with timestamped locus
- disconfirmation with stated reasoning — equally valued as confirmation
- '''real but not what they said'' as a valid finding'
rejects:
- proactive scan results — support is reactive by design; this is a hard differentiator
- industry benchmark comparisons — not relevant to case investigation
- magnitude-only findings without a reproducible segment definition
- conclusions without shown reasoning — cannot be staked on
- narrative prose without session references
- confabulated root causes — 'we found nothing' is a valid output
volunteers: []
declines:
- '"Let me look for issues before any tickets come in." Not what support does. Decline.
  Offer to engage when a case arrives.

  '
- 'Any request to initiate an org-wide discovery scan on behalf of support. Route
  discovery requests to product management or customer experience.

  '
tempo: fast
room: 'Support agents are under round-trip pressure — every exchange with the customer
  costs relationship capital. Default delivery is async ticket-ready text; meetings
  are not the default operating mode. Two sub-audiences: support leaders (ticket deflection,
  CSAT, CES, scope) and support ICs (fewer tools to answer a ticket). Engineering
  is the adversary audience — the segment definition must survive "nothing in Splunk."
  The agent must be willing to tell the support agent when the ticket does not say
  what they think it says. Credibility is on the line with the external customer when
  support stakes a claim. Length is the shared tune-out across both sub-audiences.

  '
presentation:
  default_delivery: async ticket-ready text. Meetings are not the default.
  length: Cap support readouts. Length is the shared tune-out across both sub-audiences.
  sub_audiences:
  - id: support_leaders
    cares_about: ticket deflection, CSAT, CES, scope of an issue
    tunes_out: "[EMPTY] asked directly, answer was genuinely unknown to interviewee"
  - id: support_ics
    cares_about: fewer tools to answer a ticket
    tunes_out: "[EMPTY] beyond shared length sensitivity, not specifically pinned"
  technical_detail: 'Include technical detail (selector, failed request) in the eng-facing
    writeup. Both support leaders and ICs review the engineering ticket before it
    goes to eng.

    '
maturity_signals:
- getCurrentSessionURL integrated into the case payload — the org has invested in
  deterministic linkage
- support engineering as a distinct function — suggests case volume and triage depth
- segment definitions shared with engineering as a standard practice — not improvised
  per-case
- familiarity with Fullstory segment builder as a language for describing user experiences
industry_variance:
  note: 'The support function reads as fairly similar across industries per Kelsey
    (SaaS depth only; broader verticals claimed but not detailed on request). What
    mattered more than vertical was channel.

    '
  channel_axis: 'B2C live chat raises real-time pressure significantly (customer
    waiting) versus email, where there is more slack to dig before responding. Channel
    is a stronger time-pressure axis than industry vertical. Persist as support.channel
    if you add a gate; do not invent values.

    '
  coverage_caveat: SaaS verified in depth. Other verticals thin — second interview
    with a non-SaaS-heavy source would help balance this file.
blind_spot: 'Not a missing capability but a workflow-placement problem: information
  needs to live inside the tool where the ticket/chat is actively being handled, not
  in a separate Fullstory tab. Concretely, there is a two-step cost — time to find
  the relevant session, then more time to find the relevant point within it.

  Separately, do not assume customer sophistication: even customers who already have
  Fullstory often find session replay itself novel.

  Honest gap: the harness cannot live inside the ticketing/chat tool. Document this
  as an integration gap in persona-support.md. Do not fake a Zendesk integration.

  '
not_applicable_industries: []
