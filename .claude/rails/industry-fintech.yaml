# ── OPEN QUESTIONS ────────────────────────────────────────────────────────────
# For a second interview pass. Do not fill by inference.

open_questions:
  - id: subsector_decomposition
    ask: "Does the currency mix or reference point differ across neobank / lender / payments / wealth / insurtech / B2B rails?"
    why: "'The whole mix' is the only coverage claim. Every prior here is stated at whole-vertical granularity."
  - id: mid_session_switching
    ask: "Q4 — what makes a fintech user change what they are trying to do mid-session, and what does it look like in the data?"
    why: "The only wholly empty interpretation rule. Retail has this; fintech does not."
  - id: fintech_thresholds
    ask: "Any numeric prior at all — even ordinal — for servicing depth, feature adoption, or entrenchment?"
    why: "Zero numbers exist from the SME. Ask for the shape of a good measure rather than a threshold."
  - id: cold_open_surprise
    ask: "Q5 — what surprises an analyst opening fintech data for the first time? Q11 — biggest first-timer mistake?"
    why: "Field notes flag both as the thinnest part of the interview and worth a second pass."

