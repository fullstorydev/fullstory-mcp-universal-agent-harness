schema_version: 1
# _workshop/field-model/benchmark-corpus.yaml
# Metric × slice × currency benchmark table for the derivation engine.
#
# Used in derivation rule R1, Step 2: benchmark deviation ranking.
# A candidate signal's value is compared against the applicable slice + industry cell
# to determine how far the org deviates from the reference point.
#
# ROLLBACK: rm _workshop/field-model/benchmark-corpus.yaml
#
# ── PROVENANCE ───────────────────────────────────────────────────────────────
# Source: Fullstory 2026 Benchmark Report, CY2025
# Scale: 2,600+ orgs, 18.7B sessions
# Publisher: Fullstory (internal product benchmarks team)
# Publication type: First-party aggregate report, publicly released
#
# N-2 RULING: Every literal number in this file carries an implicit source that
# resolves to the corpus-wide source declared above. Explicit per-entry source
# fields are omitted for readability; "benchmark-corpus.yaml" is the declared
# source for all downstream citations. Any profile file that cites a literal
# from this file should write: source: "Fullstory 2026 Benchmark Report,
# CY2025 — see benchmark-corpus.yaml for full table"
#
# N-3 RULING: These figures are anonymized, aggregated cross-org population
# statistics published by Fullstory. They do not attribute any individual
# customer's data. N-3 guard ("no cross-org data attributed to Fullstory") is
# satisfied: these are Fullstory's own published figures, not a disclosure of
# one customer's data presented as if it were Fullstory's internal benchmark.
#
# THIRD-PARTY PROVENANCE NOTE: This is not third-party by strict definition —
# Fullstory published it. It is classified here as a Fullstory-published aggregate
# benchmark report. It satisfies N-3's spirit (individual orgs are not identifiable).
# Per industry-retail.yaml precedent: this source is already cited in existing
# production files. See benchmark-corpus.yaml provenance decision, 2026-09-10.
#
# ── INDUSTRY → RAILS MAPPING ─────────────────────────────────────────────────
# Benchmark columns use the following mapping to MANIFEST.yaml industries:
# Retail     → retail
# Finance    → fintech  (banking, insurance, investment — includes fintech)
# Travel     → travel   (travel & hospitality)
# Software   → saas     (B2B software / SaaS)
# Gaming     → gaming   (includes gambling, sports betting)
# Food&Bev   → (no matching rail; closest: retail or travel by model)
# Business   → (no matching rail; closest: saas for B2B context)
#
# Source: benchmarks-distilled.md — Industry → Rails Mapping section

corpus_source:
  report: "Fullstory 2026 Benchmark Report"
  period: "CY2025"
  orgs: "2600+"
  sessions: "18.7B"
  publisher: "Fullstory"
  publisher_type: "first_party_aggregate"
  n2_status: "every literal number in this file satisfies N-2 via this corpus-level source"
  n3_status: "anonymized aggregate — no individual org is identifiable"

industry_to_rails_mapping:
  Retail: retail
  Finance: fintech
  Travel: travel
  Software: saas
  Gaming: gaming
  Food&Bev: null  # no matching rail; closest: retail or travel
  Business: null  # no matching rail; closest: saas

# ── METRIC DEFINITIONS ───────────────────────────────────────────────────────
# Each metric lists its unit, direction, signal class, and currency mapping.
# These mirror the metric index in benchmarks-distilled.md.
#
# IMPORTANT — session_duration valence rule (Commitment 2):
# Do not call a long session good or bad without knowing the exchange in play.
# Long session + ENJ or KNW = likely success signal.
# Long session + UTL + exit without completion = likely failure signal.
# Requires session-level inspection to disambiguate. Never score duration alone.

metrics:
  rage_clicks:
    label: "Rage Clicks"
    unit: "per 1k sessions"
    direction: lower_is_better
    signal_class: frustration
    currency_mapping: [ACQ, UTL, ENJ]
    interpretation: >
      User repeatedly clicked the same element — expected response, got none or wrong one.
      Context-dependent: rage on a checkout button (ACQ), rage on a settings control (UTL),
      rage on a media player (ENJ).
    note_gaming_mobile: >
      Gaming mobile is a wild outlier: 4,281/1k vs global mobile 589/1k.
      Broken ENJ/BEL exchange is catastrophically personal when identity is invested.
      Desktop gaming (148.6/1k) is actually low. Mobile is the problem surface.
    source: "benchmarks-distilled.md — Metric Index"

  dead_clicks:
    label: "Dead Clicks"
    unit: "per 1k sessions"
    direction: lower_is_better
    signal_class: frustration
    currency_mapping: [KNW, UTL, NAV]
    interpretation: >
      User clicked something that appeared clickable but produced no response.
      Primary: KNW (user expects info to appear, nothing does) and UTL (control appears
      interactive but isn't). Also prominent in NAV toll — user clicks what should be
      a navigation element.
    note_gaming_mobile: >
      Gaming mobile dead clicks: 12,839/1k — approximately 25× the global mobile average.
      This is the dominant signal on that surface.
    source: "benchmarks-distilled.md — Metric Index"

  error_clicks:
    label: "Error Clicks"
    unit: "per 1k sessions"
    direction: lower_is_better
    signal_class: breakage
    currency_mapping: [ACQ, UTL]
    interpretation: >
      User clicked an element that triggered a system error — form validation failure,
      API error response, etc. Breakage at the moment of spend (ACQ) or task attempt (UTL).
      Unlike frustration signals, breakage signals indicate a system failure, not a UX failure.
    source: "benchmarks-distilled.md — Metric Index"

  post_error_exits:
    label: "Post-Error Exits"
    unit: "per 1k sessions"
    direction: lower_is_better
    signal_class: breakage
    currency_mapping: [ACQ, UTL]
    interpretation: >
      User exited after encountering an error rather than recovering. The decisive exchange-failure
      signal: the system broke AND the user gave up. Retail has the highest post-error exits
      (170.6/1k global) — catastrophic when the broken moment is the checkout submission.
    source: "benchmarks-distilled.md — Metric Index"

  session_duration:
    label: "Session Duration"
    unit: "seconds"
    direction: neutral
    signal_class: engagement
    currency_mapping: [ENJ, KNW, UTL]
    valence_warning: >
      COMMITMENT 2 APPLIES. Long duration = ENJ/KNW success OR UTL failure. Do not report
      session duration as a standalone metric without anchoring to the exchange in play.
      Require active_time or exit-type corroboration before naming a direction.
    source: "benchmarks-distilled.md — Metric Index"

  active_time:
    label: "Active Time"
    unit: "seconds"
    direction: higher_is_better
    signal_class: engagement
    currency_mapping: [ENJ, KNW]
    interpretation: >
      Genuine interaction time vs. passive dwell. Higher active_time relative to session_duration
      = user engaged, not idle. Used to distinguish ENJ/KNW success from passive-dwell patterns
      that inflate session_duration without real engagement.
    source: "benchmarks-distilled.md — Metric Index"

  bounce_rate:
    label: "Bounce Rate"
    unit: "percent"
    direction: lower_is_better
    signal_class: engagement
    currency_mapping: [KNW, ENJ, NAV]
    interpretation: >
      Failed hook at entry: user arrived, found nothing that answered their currency intent, left.
      KNW bounce = page did not contain the answer. ENJ bounce = content did not engage.
      NAV bounce = couldn't find their way. Requires entry-page context to attribute.
    source: "benchmarks-distilled.md — Metric Index"

  scroll_depth:
    label: "Scroll Depth"
    unit: "percent"
    direction: higher_is_better
    signal_class: engagement
    currency_mapping: [ENJ, KNW]
    availability: "web only — not captured in mobile data"
    interpretation: >
      Content reach. High scroll depth = user reached the content they came for.
      Low scroll depth = either a quick exit (bounce) or content never surfaced
      (layout/load issue). Pair with session_duration and active_time before concluding.
    source: "benchmarks-distilled.md — Metric Index"

  thrashed_cursor:
    label: "Thrashed Cursor"
    unit: "per 1k sessions"
    direction: lower_is_better
    signal_class: frustration
    currency_mapping: [NAV]
    availability: "web only — not applicable on mobile"
    interpretation: >
      Cursor moving erratically across the page — scanning for something, unable to orient.
      Primary NAV toll signal. Reports as context for the exchange that follows, not as a
      headline finding. See nav_toll reporting_rule in currency-signals.yaml.
    source: "benchmarks-distilled.md — Metric Index"

  suspicious_activity:
    label: "Suspicious Activity"
    unit: "per 100k sessions"
    direction: lower_is_better
    signal_class: traffic_quality
    currency_mapping: []
    currency_note: "Not currency-specific — synthetic traffic distorts all signals equally."
    interpretation: >
      Non-human sessions. High suspicious activity inflates or deflates all other metrics.
      Always check before headlining any behavioral finding. Use build_segment with Suspicious
      Activity Automation type before finalizing any report.
    yoy_warning: >
      Food&Bev +1,372,156% YoY and global +892% are largely attributable to AI crawlers
      and agent traffic, not fraud. Treat as directional only — sparse, low-base signal.
    source: "benchmarks-distilled.md — Metric Index"

  pinch_events:
    label: "Pinch Events"
    unit: "per 1k sessions"
    direction: neutral
    signal_class: mobile
    currency_mapping: [ENJ, KNW, UTL]
    interpretation: >
      User pinched to zoom — content was too small or dense to read at native scale.
      A content legibility signal on mobile. Direction is neutral: occasional pinch is
      expected; high frequency signals persistent legibility problems.
    source: "benchmarks-distilled.md — Metric Index"

