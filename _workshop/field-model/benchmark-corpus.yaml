# ── INDUSTRY PATTERNS — FOR RAIL CALIBRATION ─────────────────────────────────
# Key interpretive patterns per industry. Used to set substrate_tolerance and
# reference_point in industry rail files. Each entry summarizes the benchmark
# behavior that distinguishes this industry.
# Source: benchmarks-distilled.md §Industry-Specific Benchmark Patterns

industry_calibration_notes:

  retail:
    rails_slug: retail
    primary_currency: ACQ
    post_error_exits_note: >
      Highest post-error exits of all industries (170.6/1k global). Errors at the moment
      of purchase commitment are catastrophic — ACQ exchange fails irreversibly.
    rage_trend: "YoY +262% — ACQ frustration is the growing problem, not breakage."
    reference_point: "conversion benchmarks"
    emea_anomaly: "EMEA retail rage: 351.7/1k — highest of any global region × industry combination."
    source: "benchmarks-distilled.md §Retail"

  fintech:
    rails_slug: fintech
    benchmark_industry: Finance
    primary_currency: UTL
    lowest_rage: "133.2/1k global — users accept deliberate, slow flows. Regulatory constraint suppresses speed expectations."
    lowest_bounce: "46.3% global"
    trend_note: >
      YoY rage clicks improving (-10%) while error clicks rising (+17%). Breakage is the
      growing problem for Finance, not frustration.
    reference_point: "task completion and error recovery"
    source: "benchmarks-distilled.md §Finance"

  travel:
    rails_slug: travel
    primary_currencies: [KNW, ACQ]
    lowest_dead_clicks: "344.6/1k — users find what they want."
    session_duration_trend: "YoY +62% — longest-growing session duration of any industry. Research phase expanding."
    catastrophic_moment: "Booking friction after long research — perceived value diverges from realized."
    reference_point: "booking conversion after research phase"
    source: "benchmarks-distilled.md §Travel"

  saas:
    rails_slug: saas
    benchmark_industry: Software
    primary_currency: UTL
    highest_dead_clicks: "618.2/1k — users encounter controls that don't respond."
    highest_session_duration: "2,085 sec — long sessions signal deep engagement OR inability to complete."
    highest_scroll_depth: "84% — users are willing to work for the answer."
    valence_ambiguity: >
      Software has the strongest session-duration valence ambiguity. Long session +
      high active_time = engaged. Long session + low active_time + no task completion = stuck.
      Never report session duration for a Software org without active_time corroboration.
    source: "benchmarks-distilled.md §Software"

  gaming:
    rails_slug: gaming
    primary_currencies: [ENJ, BEL]
    mobile_outlier: >
      Mobile rage: 4,281/1k, dead clicks: 12,839/1k — 10–30× other industries.
      Desktop rage: 148.6/1k (actually low). Mobile is the problem surface.
    exchange_intensity: >
      Broken ENJ/BEL exchange is catastrophically personal — user identity is invested
      in the gaming context. Frustration reads as betrayal, not inconvenience.
    source: "benchmarks-distilled.md §Gaming"

  food_bev:
    rails_slug: null  # no current rail — closest: retail or travel
    primary_currency: UTL
    shortest_session: "1,007 sec — users want to order fast, not browse."
    interpretation: "Task-dominant: fast-order flow. Frustrated UTL = high post-error exits (147.2/1k)."
    suspicious_activity_note: "Food&Bev has anomalous suspicious activity figures. Treat as noise."
    source: "benchmarks-distilled.md §Food&Bev"
