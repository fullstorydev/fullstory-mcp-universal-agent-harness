# Used in R1 trend modifier: if a metric is worsening YoY, score × 1.3.
# These are directional signals for ranking — not absolute values.
# Source: benchmarks-distilled.md §YoY Change

yoy_change:
  period: "CY2024 to CY2025"
  slice: global
  unit: "percent change"
  source: "Fullstory 2026 Benchmark Report, CY2025 — benchmarks-distilled.md §YoY Change Global"
  suspicious_activity_warning: >
    Food&Bev suspicious activity +1,372,156% and global +892% are AI crawler / agent
    traffic noise, not organic fraud. Treat as directional only — sparse, low-base signal.
  data:
    rage_clicks:
      All: +77
      Retail: +262
      Finance: -10
      Food&Bev: -34
      Travel: -3
      Software: +10
      Gaming: +32
      Business: +235
    dead_clicks:
